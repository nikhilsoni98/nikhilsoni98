<svg xmlns="http://www.w3.org/2000/svg" width="290" height="200" viewBox="0 0 290 200">
<style>
  .card { animation: pop .9s 0.2s ease-out both; }
  @keyframes pop { from { opacity:0; transform: translateY(26px); } to { opacity:1; transform:none; } }
  .b { stroke-dasharray: 90 700; animation: run 5s linear infinite; }
  @keyframes run { to { stroke-dashoffset: -790; } }
</style>
<g class="card">
  <rect x="1" y="1" width="288" height="198" rx="16" fill="#0b1220" stroke="#1e293b"/>
  <rect class="b" x="1" y="1" width="288" height="198" rx="16" fill="none" stroke="#61dafb" stroke-width="2.5" stroke-linecap="round"/>
  <text x="22" y="40" style="font:700 12px 'Fira Code', 'SFMono-Regular', Consolas, monospace" fill="#61dafb">PROJECT 01</text>
  <text x="22" y="68" style="font:700 19px 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" fill="#f1f5f9">CS Department Website</text>
  <text x="22" y="92" style="font:400 13.5px 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" fill="#94a3b8">Official live website of the</text><text x="22" y="112" style="font:400 13.5px 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" fill="#94a3b8">Computer Science department.</text><text x="22" y="132" style="font:400 13.5px 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" fill="#94a3b8">Responsive React.js UI,</text><text x="22" y="152" style="font:400 13.5px 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" fill="#94a3b8">deployed on Vercel.</text><g transform="translate(22,158)"><rect width="62" height="24" rx="12" fill="#61dafb" fill-opacity=".15" stroke="#61dafb" stroke-opacity=".6"/><text x="31.0" y="16" text-anchor="middle" style="font:600 11.5px 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" fill="#61dafb">React</text></g><g transform="translate(92,158)"><rect width="70" height="24" rx="12" fill="#61dafb" fill-opacity=".15" stroke="#61dafb" stroke-opacity=".6"/><text x="35.0" y="16" text-anchor="middle" style="font:600 11.5px 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" fill="#61dafb">Vercel</text></g>
