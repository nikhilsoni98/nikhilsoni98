  <text x="22" y="68" style="font:700 19px 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" fill="#f1f5f9">MimicGuard</text>
  <text x="22" y="92" style="font:400 13.5px 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" fill="#94a3b8">Adaptive multi-factor</text><text x="22" y="112" style="font:400 13.5px 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" fill="#94a3b8">authentication system with</text><text x="22" y="132" style="font:400 13.5px 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" fill="#94a3b8">secure validation and identity</text><text x="22" y="152" style="font:400 13.5px 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" fill="#94a3b8">protection.</text><g transform="translate(22,158)"><rect width="86" height="24" rx="12" fill="#f472b6" fill-opacity=".15" stroke="#f472b6" stroke-opacity=".6"/><text x="43.0" y="16" text-anchor="middle" style="font:600 11.5px 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" fill="#f472b6">Security</text></g><g transform="translate(116,158)"><rect width="46" height="24" rx="12" fill="#f472b6" fill-opacity=".15" stroke="#f472b6" stroke-opacity=".6"/><text x="23.0" y="16" text-anchor="middle" style="font:600 11.5px 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" fill="#f472b6">MFA</text></g>
