<svg xmlns="http://www.w3.org/2000/svg" width="900" height="260" viewBox="0 0 900 260">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#0f172a"><animate attributeName="stop-color" values="#0f172a;#1e1b4b;#0c4a6e;#0f172a" dur="10s" repeatCount="indefinite"/></stop>
    <stop offset="1" stop-color="#1e1b4b"><animate attributeName="stop-color" values="#1e1b4b;#0c4a6e;#0f172a;#1e1b4b" dur="10s" repeatCount="indefinite"/></stop>
  </linearGradient>
  <linearGradient id="nm" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#67e8f9"/>
  </linearGradient>
  <filter id="blur"><feGaussianBlur stdDeviation="30"/></filter>
  <clipPath id="c"><rect width="900" height="260" rx="18"/></clipPath>
</defs>
<style>
  .name { font: 800 62px 'Segoe UI', 'Helvetica Neue', Arial, sans-serif; fill: url(#nm); animation: up 1s ease-out both; }
  .role { font: 500 22px 'Segoe UI', 'Helvetica Neue', Arial, sans-serif; fill: #cbd5e1; letter-spacing: 3px; animation: up 1s .35s ease-out both; }
  .tag { font: 500 14px 'Fira Code', 'SFMono-Regular', Consolas, monospace; fill: #67e8f9; animation: up 1s .7s ease-out both; }
  @keyframes up { from { opacity:0; transform: translateY(24px); } to { opacity:1; transform: translateY(0); } }
  .o1 { animation: f1 9s ease-in-out infinite; }
  .o2 { animation: f2 11s ease-in-out infinite; }
  .o3 { animation: f3 13s ease-in-out infinite; }
  @keyframes f1 { 0%,100% { transform: translate(0,0); } 50% { transform: translate(120px,40px); } }
  @keyframes f2 { 0%,100% { transform: translate(0,0); } 50% { transform: translate(-140px,-30px); } }
  @keyframes f3 { 0%,100% { transform: translate(0,0); } 50% { transform: translate(60px,-50px); } }
  .dot { animation: tw 3s ease-in-out infinite; }
  @keyframes tw { 0%,100% { opacity:.15; } 50% { opacity:.9; } }
</style>
<g clip-path="url(#c)">
  <rect width="900" height="260" fill="url(#bg)"/>
  <g filter="url(#blur)">
    <circle class="o1" cx="150" cy="70" r="70" fill="#6366f1" opacity=".55"/>
    <circle class="o2" cx="760" cy="190" r="80" fill="#06b6d4" opacity=".45"/>
    <circle class="o3" cx="450" cy="230" r="60" fill="#a855f7" opacity=".4"/>
  </g>
  <circle class="dot" cx="80" cy="40" r="2" fill="#fff" style="animation-delay:0s"/><circle class="dot" cx="210" cy="200" r="2" fill="#fff" style="animation-delay:0.6s"/><circle class="dot" cx="330" cy="60" r="2" fill="#fff" style="animation-delay:1.2s"/><circle class="dot" cx="520" cy="35" r="2" fill="#fff" style="animation-delay:1.8s"/><circle class="dot" cx="640" cy="90" r="2" fill="#fff" style="animation-delay:0.3s"/><circle class="dot" cx="820" cy="50" r="2" fill="#fff" style="animation-delay:0.9s"/><circle class="dot" cx="700" cy="225" r="2" fill="#fff" style="animation-delay:1.5s"/><circle class="dot" cx="120" cy="130" r="2" fill="#fff" style="animation-delay:2.1s"/><circle class="dot" cx="860" cy="150" r="2" fill="#fff" style="animation-delay:2.4s"/><circle class="dot" cx="400" cy="150" r="2" fill="#fff" style="animation-delay:0.45s"/>
  <text class="name" x="450" y="118" text-anchor="middle">Nikhil Soni</text>
  <text class="role" x="450" y="162" text-anchor="middle">FULL STACK MERN DEVELOPER</text>
  <text class="tag" x="450" y="200" text-anchor="middle">&lt;React /&gt; &#183; Node.js &#183; MongoDB &#183; AWS &#183; Jaipur, India</text>
</g>
<rect x="1" y="1" width="898" height="258" rx="18" fill="none" stroke="#67e8f9" stroke-opacity=".25"/>
</svg>